# GENERATED from the gate registry (`discover::gates`) — THE PIPELINE IS A LOCK.
# Never edit by hand: regenerate with `cargo run --example freeze_gates` and ratify
# the diff. The registry is the single source for the commands, cadences, the
# toolchain pin, and the sweep schedule; `spec/gates.spec` carries the promises.
name: ci

# Default-deny at the top; the two tag-advance/release jobs elevate to
# `contents: write` explicitly. (Scorecard's token-permissions criterion,
# and simply the capability-honesty rule applied to CI itself.)
permissions:
  contents: read

# Dogfood everywhere, all the time. The fast gates run on every push and PR; the
# mutation gate — the method's own "the real test" — runs per-change on PRs (only
# the changed lines), incrementally on the default branch (only the diff since the
# last fully-certified tree, marked by the `mutants-green` tag, advanced on green),
# and as a sharded whole-crate sweep on the weekly clock.
#
# The Rust toolchain is PINNED (not `@stable`): the `tests/compile_fail` trybuild
# suites match saved `.stderr` files, and rustc's diagnostic rendering changes
# between versions. Bump the pin in `discover::gates::TOOLCHAIN` in lockstep with
# regenerating the `.stderr` files (TRYBUILD=overwrite), then re-freeze.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1" # the periodic whole-crate guarantee
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets

  # Per-change dogfood: mutate only the lines this PR touches. New code that a
  # probe cannot kill fails the gate; pre-existing documented equivalents are
  # not in the diff, so they never re-trip it.
  mutants-diff:
    name: dogfood (changed lines)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,cargo-nextest
      - name: mutate the diff
        run: |
          git diff "origin/${{ github.base_ref }}...HEAD" > pr.diff
          .github/mutants-gate.sh --in-diff pr.diff

  # Incremental dogfood on the default branch: a green sweep is a lock over the
  # tree at that sha (the `mutants-green` tag), so a merge mutates only the diff
  # since it. On green the tag advances — CI's countersignature, the pipeline's
  # one effect. A red gate leaves the tag put, so the next merge re-verifies the
  # accumulated drift. The weekly sharded sweep re-certifies from scratch.
  mutants-incremental:
    name: dogfood (since green)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,cargo-nextest
      - name: mutate the drift since the certified tree
        run: |
          git rev-parse -q --verify refs/tags/mutants-green >/dev/null || { echo "::error::no mutants-green tag - bootstrap by dispatching this workflow (Actions -> ci -> Run workflow): the full sweep's countersign plants the tag it earns"; exit 1; }
          git diff "mutants-green...HEAD" > since-green.diff
          .github/mutants-gate.sh --in-diff since-green.diff
      - name: countersign — advance the certified-tree tag
        run: |
          git tag -f mutants-green
          git push -f origin mutants-green
      - name: release — the certified tree publishes itself
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: .github/release.sh

  # Weekly companion gate: one plain job on the weekly clock, feeding the
  # same countersign — see the gate registry for what it verifies.
  mutants-delta-render-plumbing:
    name: dogfood (delta-render plumbing)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,cargo-nextest
      - run: .github/mutants-gate.sh --package delta-render --config .github/delta-render-mutants.toml

  # Weekly companion gate: one plain job on the weekly clock, feeding the
  # same countersign — see the gate registry for what it verifies.
  mutants-statement-bites-lean-corpus:
    name: dogfood (statement bites (lean corpus))
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,cargo-nextest
      - run: .github/statement-bite.sh

  # Weekly companion gate: one plain job on the weekly clock, feeding the
  # same countersign — see the gate registry for what it verifies.
  mutants-fire-drill-plumbing:
    name: dogfood (fire-drill plumbing)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,cargo-nextest
      - run: .github/mutants-gate.sh --package fire-drill --config .github/fire-drill-mutants.toml

  # Weekly companion gate: one plain job on the weekly clock, feeding the
  # same countersign — see the gate registry for what it verifies.
  mutants-layout-probe-plumbing:
    name: dogfood (layout-probe plumbing)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,cargo-nextest
      - run: .github/mutants-gate.sh --package layout-probe --config .github/layout-probe-mutants.toml

  # World gate: read state the tree cannot contain, hold it to the declared
  # floor — see the gate registry for what it verifies. Not a countersign
  # input: a world fact is not evidence about the tree.
  world-perimeter-settings-drift:
    name: perimeter (settings drift)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - run: .github/perimeter.sh

  # World gate: read state the tree cannot contain, hold it to the declared
  # floor — see the gate registry for what it verifies. Not a countersign
  # input: a world fact is not evidence about the tree.
  world-substrate-git-drift:
    name: substrate (git drift)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - run: .github/substrate.sh

  # Whole-crate dogfood: the green gate is "0 MISSED". Timeouts (non-termination
  # mutants) are DETECTIONS, not survivors — `.github/mutants-gate.sh` distinguishes
  # a timeout-only exit (pass) from a real survivor in `missed.txt` (fail). The
  # ratified equivalents are carved out by `.cargo/mutants.toml`. Sharded: the
  # ~1,300-mutant sweep is ~5½ serial hours, past a hosted runner's patience.
  mutants-full:
    name: dogfood (full sweep)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,cargo-nextest
      - run: .github/mutants-gate.sh --shard ${{ matrix.shard }}/8

  # The tag is only ever planted or advanced by a run that EARNED it: the
  # incremental gate advances it per-merge, and this countersign advances it when
  # EVERY shard of the full sweep is green — which is also the BOOTSTRAP (no tag
  # yet? dispatch this workflow once; the certification plants it) and the
  # recovery after a red stretch (the weekly green re-anchors the diff).
  # MAIN-ONLY: a branch dispatch runs the sweeps as evidence, but the tag names
  # the certified DEFAULT-BRANCH tree — a branch tip must never claim it.
  mutants-full-countersign:
    name: countersign (full sweep)
    needs: [mutants-full, mutants-delta-render-plumbing, mutants-statement-bites-lean-corpus, mutants-fire-drill-plumbing, mutants-layout-probe-plumbing]
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: countersign — advance the certified-tree tag
        run: |
          git tag -f mutants-green
          git push -f origin mutants-green
      - name: release — the certified tree publishes itself
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: .github/release.sh
