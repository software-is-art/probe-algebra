[package]
name = "boundary-spec-macros"
version = "0.1.0"
edition = "2021"
description = "Derive macros for boundary-spec: generate a value object's probe surface from its structure."
license = "MIT OR Apache-2.0"
repository = "https://github.com/software-is-art/probe-algebra"
readme = "README.md"
keywords = ["derive", "proc-macro", "probe", "boundary", "testing"]
categories = ["development-tools::procedural-macro-helpers", "development-tools::testing"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "visit-mut"] }
quote = "1"
proc-macro2 = "1"
