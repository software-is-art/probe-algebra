[package]
name = "boundary-algebra-macros"
version = "0.1.0"
edition = "2021"
description = "Derive macros for boundary-algebra: generate a value object's probe surface from its structure."
license = "MIT OR Apache-2.0"
repository = "https://github.com/software-is-art/probe-algebra"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
