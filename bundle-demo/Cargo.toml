# BUNDLE-BORN (docs/roadmap.md, "the bundle is the source"): this member's src was grown
# ENTIRELY by the continuation verbs — `bundle add` for every item, `bundle lift` for the
# committed zero-annotation lift — never edited in an open file. MANIFEST.md records every
# command. This shell (Cargo.toml, lib.rs's mod line, the tests) is the one hand-made part:
# the birth act, genesis's residue, minted once.
[package]
name = "bundle-demo"
version = "0.0.0"
edition = "2021"
publish = false
description = "The bundle-born member: a module grown by the continuation verbs, its contract declared, judged, and drift-gated."

[dependencies]
boundary-spec = { path = "..", version = "0.2.0" }

[dev-dependencies]
spec-lock = { path = "../spec-lock", version = "0.1.0" }
