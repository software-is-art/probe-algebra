# cargo-mutants configuration.
#
# Mutation testing is the engine of this method: it certifies that the probe
# suite actually kills planted bugs, and any SURVIVING mutant points at a
# missing relation or degree of freedom (see src/select/boundary.rs::uncoverable).
#
# WHERE mutations are generated — the WHOLE runtime library is in scope. Every part
# of the runtime is now SELF-HOSTED: certified by oracle-free probes (round-trips,
# exact partitions, declared laws) with zero hand-written example tests, and judged
# here by mutation. The interpreter (`interp/`) and the kill-matrix selector
# (`select/`) are structural self-hosts (boundary + interior, no interior tests);
# `gdp` (the name/proof vocabulary) and `capability` (the claim-vs-behaviour audit)
# are crate-level grammar that `build.rs` exempts from the structural rules, so they
# are self-hosted by VERIFICATION — their example tests replaced with oracle-free
# property probes, kept in scope here. We exclude only:
#
#   - `src/main.rs` — the `demo` binary only prints, no assertions, so its
#     mutants are noise.
#
# The `#[derive(Shaped)]` proc-macro (`boundary-spec-macros`) is NO LONGER excluded,
# but it generates ZERO mutants: its functions return `proc_macro2::TokenStream` (built
# with `quote!`), which cargo-mutants cannot synthesize a replacement for, so there is no
# mutable surface. Its OUTPUT is dogfooded instead — every derived `Shaped` impl is hit by
# the fused-probe and universal-sensitivity oracle-free tests.
#
# `interp/internal.rs` and `select/internal.rs` are DELIBERATELY kept in scope despite
# being module-internal: the interpreter is the experiment that MEASURES whether the
# boundary rigour buys zero internal testing, and the selector is the method turned on
# its own kernel. Their mutation scores quantify exactly how much internal correctness
# the boundary contracts certify for free.
exclude_globs = [
    "src/main.rs",
]

# The full sweep is a GREEN GATE on "0 MISSED". Inherent non-termination mutants — a greedy
# loop's termination guard relaxed to "never stop", or a `Pos::index` pinned to a constant so
# the lexer never reaches the end — are reported as TIMEOUT: a detection (the mutant hangs, the
# original terminates), not a miss. `cargo mutants` still exits non-zero on a timeout, so CI
# runs it through `.github/mutants-gate.sh`, which passes on a timeout-only exit and fails only
# on a real survivor in `missed.txt`.
#
# Three EQUIVALENT mutants remain that no probe can (or should) kill — each a genuine
# free choice or a redundant guard, documented here and carved out by FUNCTION (robust to
# line edits) so they do not mask a real survivor. They are findings, not gaps:
#   - `Shaped for bool::inhabitant` — the canonical seed is an arbitrary `bool`; `false`
#     equals `Default::default()`, so the value is unobservable by any sensitivity probe.
#   - `Declares for ResolvePretendsPure::declared_sources` — it legitimately declares
#     NOTHING (that is the under-claim being demonstrated), so an empty-slice mutant is
#     indistinguishable.
#   - the interpreter lexer's `is_ascii_alphabetic` first-char guard relaxed to `true` —
#     every newly-admitted identifier is still rejected by `Ident::new`, so the guard is
#     redundant and the relaxation is behaviour-preserving.
# (`select`'s former three equivalents were ELIMINATED, not excluded — the selector now
# uses `Reverse` and `max_by_key` and drops a redundant guard, so it has no mutable
# arithmetic/comparison left to survive.)
exclude_re = [
    "<impl Shaped for bool>::inhabitant",
    "<impl Declares for ResolvePretendsPure>::declared_sources",
    "match guard c.is_ascii_alphabetic",
]

# Mutation testing certifies the LIBRARY against the unit + property suites, so
# run only those. The `tests/compile_fail` (trybuild) suite is the NEGATIVE
# specification of the interpreter boundary — it asserts illegal uses (e.g. a
# `WellTyped` proof for the wrong program, a `Lossy` edge through `run_pure`) fail
# to COMPILE, never executing `src` runtime code, so it kills no `src` mutant. It is
# also excluded because trybuild's `.stderr` matching is sensitive to the build
# environment and is unstable inside cargo-mutants' copied tree.
additional_cargo_test_args = ["--lib"]

# Run each mutant's suite through nextest: its default is FAIL-FAST, so a killed mutant
# stops at its first failing probe instead of running out the whole suite — most mutants
# die early (that is what a good suite means), so this is the cheap majority of the sweep's
# per-mutant time. The `--lib` scope above applies unchanged (nextest accepts cargo's
# target filters). CI installs cargo-nextest alongside cargo-mutants in every mutation job
# (a census test holds the two install lists together).
test_tool = "nextest"
