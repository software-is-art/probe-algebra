[package]
name = "boundary-spec"
version = "0.1.0"
edition = "2021"
description = "A module boundary specified precisely enough that its validating tests — and the proof their interior is correct — derive themselves."
license = "MIT OR Apache-2.0"
repository = "https://github.com/software-is-art/probe-algebra"
readme = "README.md"
keywords = ["mutation-testing", "property-testing", "boundary", "category", "verification"]
categories = ["development-tools::testing", "rust-patterns"]
# CI plumbing is not part of the library contract; everything else (src/, spec/, docs/,
# examples/, tests/) ships so the packaged crate is self-verifying — build.rs re-runs the
# boundary discipline over the packaged tree and drift-gates spec/qualify.spec, which
# therefore MUST stay in the package.
exclude = [".github/", ".cargo/"]

[workspace]
members = [
    ".",
    "boundary-spec-macros",
    "boundary-enforce",
    "delta-render",
    "layout-probe",
    "downstream-fixture",
    "fire-drill",
    "genesis-demo",
    "relay-demo",
    "spec-lock",
]

[[bin]]
name = "demo"
path = "src/main.rs"

[dependencies]
boundary-spec-macros = { path = "boundary-spec-macros", version = "0.1.0" }
# The freeze/drift-gate mechanics (`discover::freeze` is a thin adapter over it) — extracted so
# any project can lift the "frozen spec + drift gate" discipline without the discovery engine.
spec-lock = { path = "spec-lock", version = "0.1.0" }
# `TypeEq` witnesses that PROVE the type-level capability-lattice laws at compile time (the
# `Join` table has no runtime body, so mutation cannot reach it). Tiny, no-std-friendly.
typewit = "1"
# GENESIS (`discover::scaffold::genesis`) PARSES the blank-slate `system! { ... }` declaration
# from its token stream — the declaration is Rust surface syntax, never a bespoke DSL — and the
# generator's tests hold every emitted `.rs` body to `syn::parse_file` (syn-clean output).
syn = { version = "2", features = ["full"] }
# Genesis renders a declared raw TYPE (any `syn::Type`, not just a plain path) back to text
# for the generated newtypes. Already transitive via syn; named so the render is first-class.
quote = "1"
# The FULL-GRAMMAR `system!` arm derives module paths from declaration idents
# (`meter` -> `meter_ops`/`Meter`) — paste's case/concat conversion is what lets ONE
# declaration text serve both lifecycle stages. Re-exported (hidden) for downstream macro use.
paste = "1"
# Genesis splices the ORIGINAL `system! { ... }` declaration text into the generated
# `src/system.rs` verbatim — span-locations supplies the byte offsets of the parsed block.
proc-macro2 = { version = "1", features = ["span-locations"] }

[dev-dependencies]
# the repo's own fire-drill battery (tests/fire_drill.rs): known-bad fixtures proving the
# discipline's gates can still fire.
fire-drill = { path = "fire-drill" }
proptest = "1"
trybuild = "1.0.117"
# Only the `suite_audit` example uses these — to parse cargo-mutants' `outcomes.json`
# and feed the real kill matrix into `select`. Not a library dependency.
serde_json = "1"

[build-dependencies]
# The enforcement passes themselves (tier partition, boundary grammar, inward rule, capability
# honesty, probe completeness, qualify census) — extracted so any crate's build.rs can attach the
# same discipline. This repo's build.rs is now a thin shim over it; the KERNEL allowlist stays in
# the shim, where admitting a member remains a reviewed diff in THIS tree.
boundary-enforce = { path = "boundary-enforce", version = "0.1.0" }

# delta-render's drift gates re-run discovery (and the whole algebra-mutation verdict)
# inside every `cargo test`, and Engine<T> monomorphizes INTO that crate — so it alone
# is built optimized in dev/test. Measured: the freeze path drops from ~95s to seconds;
# nothing else in the workspace pays for it.
[profile.dev.package.layout-probe]
opt-level = 2

[profile.dev.package.delta-render]
opt-level = 2
