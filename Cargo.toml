[package]
name = "boundary-algebra"
version = "0.1.0"
edition = "2021"
description = "A module boundary specified precisely enough that its validating tests — and the proof their interior is correct — derive themselves."
license = "MIT OR Apache-2.0"
repository = "https://github.com/software-is-art/probe-algebra"
readme = "README.md"
keywords = ["mutation-testing", "property-testing", "boundary", "category", "verification"]
categories = ["development-tools::testing", "rust-patterns"]

[workspace]
members = [".", "boundary-algebra-macros", "spec-lock"]

[[bin]]
name = "demo"
path = "src/main.rs"

[dependencies]
boundary-algebra-macros = { path = "boundary-algebra-macros", version = "0.1.0" }
# The freeze/drift-gate mechanics (`discover::freeze` is a thin adapter over it) — extracted so
# any project can lift the "frozen spec + drift gate" discipline without the discovery engine.
spec-lock = { path = "spec-lock", version = "0.1.0" }
# `TypeEq` witnesses that PROVE the type-level capability-lattice laws at compile time (the
# `Join` table has no runtime body, so mutation cannot reach it). Tiny, no-std-friendly.
typewit = "1"

[dev-dependencies]
proptest = "1"
trybuild = "1.0.117"
# Only the `suite_audit` example uses these — to parse cargo-mutants' `outcomes.json`
# and feed the real kill matrix into `select`. Not a library dependency.
serde_json = "1"

[build-dependencies]
syn = { version = "2", features = ["full", "visit"] }
